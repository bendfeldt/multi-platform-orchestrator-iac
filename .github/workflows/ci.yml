name: ci

on:
  pull_request:
  workflow_call:

# Pull requests never get a cloud login: all tests run against mocked providers.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - run: scripts/ci.sh
