name: deploy

# Applies dev, then test, then prod. Each job runs in its GitHub environment (reviewers on test
# and prod) and logs in as that environment's infra deployer through its federated credential
# (subject repo:<owner>/<repo>:environment:<env>). Environment variables (IDs only, no secrets):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  apply:
    needs: ci
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, test, prod]
    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - run: scripts/apply.sh "$ENVIRONMENT"
        env:
          ENVIRONMENT: ${{ matrix.environment }}
